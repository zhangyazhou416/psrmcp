# CI: unit tests + automatic PyPI publishing (PyPI Trusted Publishing / OIDC — no long-lived tokens in CI).
#
# One-time setup before the first release (pypi.org):
#   Log in → Account settings → Publishing → Add a new pending publisher
#     PyPI project name:  psrmcp
#     Pending publisher:  GitLab CI/CD
#     Owner (namespace):  zhangyazhou416
#     Repository name:    psrmcp
#     Workflow filename:  .gitlab-ci.yml
# (After the project's first successful publish, manage it under the project's Project settings → Publishing.)
#
# How to release: pushing a tag triggers build & upload
#   git tag v0.1.0 && git push origin v0.1.0
# (Keep the tag in sync with the version in pyproject.toml; PyPI forbids re-uploading the same version.)

stages:
  - test
  - publish

unit-tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/
  script:
    - uv sync
    - uv run pytest tests/unit -q

publish-pypi:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  id_tokens:
    PYPI_ID_TOKEN:          # GitLab OIDC ID token; aud must be pypi
      aud: pypi
  script:
    - uv build
    # Exchange the OIDC ID token with PyPI for a one-time upload token (accepted by uv publish as UV_PUBLISH_TOKEN)
    - |
      cat > /tmp/mint_token.py <<'PY'
      import json, os, urllib.request

      req = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      with urllib.request.urlopen(req) as resp:
          print(json.load(resp)["token"])
      PY
      export UV_PUBLISH_TOKEN="$(python3 /tmp/mint_token.py)"
      uv publish
  rules:
    - if: $CI_COMMIT_TAG    # publish only on tags; the job can also be run manually from the GitLab UI
      when: on_success
