# GitHub Actions: push a tag to publish to PyPI automatically (PyPI Trusted Publishing / OIDC).
# Same role as .gitlab-ci.yml; GitHub has no identity-verification gate, so it is
# the recommended publishing channel.
#
# One-time setup (pypi.org web UI):
#   Log in → Account settings → Publishing → Add a new pending publisher
#     PyPI project name:  psrmcp
#     Owner:              zhangyazhou416
#     Repository:         psrmcp
#     Workflow name:      publish.yml
#     Environment:        leave empty
# (After the first successful publish, manage it under the project's Project settings → Publishing.)
#
# Note: Trusted Publishing requires the GitHub repository to be public.
# To keep it private, use an API token instead — store PYPI_API_TOKEN (masked)
# in the repository Secrets and replace the last step with:
#   - run: uv publish
#     env:
#       UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
#
# How to release: git tag v0.1.0 && git push origin v0.1.0 (triggered when both remotes receive the tag)

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/unit -q

  publish-pypi:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
