[project]
name = "psrmcp"
version = "0.1.0"
description = "MCP server wrapping pulsar astronomy software (dspsr, psrchive, tempo2, psrcat, PINT)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "psrmcp contributors" }]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "astropy>=8.0,<9",
    "pint-pulsar>=1.1,<2",
    "matplotlib>=3.11,<4",
    "psrqpy>=1.3,<2",
    "numpy>=2.1,<3",
]

[project.urls]
Repository = "https://gitlab.com/zhangyazhou416/psrmcp"
Issues = "https://gitlab.com/zhangyazhou416/psrmcp/-/issues"

[project.scripts]
psrmcp = "psrmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psrmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
